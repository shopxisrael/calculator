name: Update tax data

# מרענן את הנתונים המוטמעים ב-personal-import-tax.html:
# טבלת המסים של רשות המסים + השערים היציגים של בנק ישראל.
# הדף עצמו לא פונה לשום API מהדפדפן, ולכן אין בעיית CORS.

on:
  schedule:
    # רץ בכל יום, כולל שישי ושבת.
    # נבדק מול ה-API: בנק ישראל מפרסם שער יציג בימים שני עד שישי —
    # כלומר יש שער ביום שישי (שהלוח הקודם, ראשון-חמישי, החמיץ עד יום ראשון),
    # ואין שער חדש ביום ראשון. טבלת המסים עשויה להתעדכן בכל יום, כולל בסופ"ש.
    # 14:40 UTC = 17:40 בישראל (קיץ) / 16:40 (חורף) — אחרי הפרסום ב-15:15.
    - cron: "40 14 * * *"
    # ריצת בוקר: מרעננת את הנתונים ואת חותמת התאריך לפני תחילת היום.
    - cron: "5 5 * * *"
    # ריצת ערב: תופסת עדכוני מסים שמתפרסמים בערב או במוצאי שבת.
    - cron: "10 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-data.mjs"
      - ".github/workflows/update-tax-data.yml"

permissions:
  contents: write

concurrency:
  group: update-tax-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch data and embed it in the page
        run: node scripts/update-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- personal-import-tax.html; then
            echo "אין שינוי בנתונים."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add personal-import-tax.html
          git commit -m "Update embedded tax table and exchange rates"
          git push
